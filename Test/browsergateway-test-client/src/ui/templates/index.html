<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserGateway 测试客户端</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>BrowserGateway 功能测试客户端</h1>
        
        <!-- 配置面板 -->
        <div class="config-panel">
            <h2>配置</h2>
            <div class="config-row">
                <label>服务器地址:</label>
                <input type="text" id="serverHost" value="127.0.0.1">
            </div>
            <div class="config-row">
                <label>HTTP 端口:</label>
                <input type="number" id="httpPort" value="8090">
            </div>
            <div class="config-row">
                <label>IMEI:</label>
                <input type="text" id="imei" value="123456789012345">
            </div>
            <div class="config-row">
                <label>IMSI:</label>
                <input type="text" id="imsi" value="987654321098765">
            </div>
            <div class="config-row">
                <label>协议类型:</label>
                <select id="protocolType">
                    <option value="tcp_control">TCP 控制流（非 TLS，无需证书）</option>
                    <option value="tcp_media">TCP 媒体流（非 TLS，无需证书）</option>
                    <option value="websocket_control">WebSocket 控制流</option>
                    <option value="websocket_media">WebSocket 媒体流</option>
                </select>
            </div>
            <div class="config-row">
                <button id="connectBtn" onclick="connect()">连接</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
            </div>
        </div>
        
        <!-- 状态显示 -->
        <div class="status-panel">
            <h2>连接状态</h2>
            <div id="connectionStatus" class="status disconnected">未连接</div>
        </div>
        
        <!-- 视频显示区域 -->
        <div class="video-panel">
            <h2>视频显示</h2>
            <canvas id="videoCanvas" width="1920" height="1080"></canvas>
            <div class="video-controls">
                <button onclick="startVideoStream()">开始视频流</button>
                <button onclick="stopVideoStream()">停止视频流</button>
            </div>
        </div>
        
        <!-- 控制面板 -->
        <div class="control-panel">
            <h2>控制</h2>
            <div class="virtual-keys">
                <button class="key-btn" onclick="sendKey(19, 0)">↑</button>
                <div>
                    <button class="key-btn" onclick="sendKey(21, 0)">←</button>
                    <button class="key-btn" onclick="sendKey(66, 0)">确认</button>
                    <button class="key-btn" onclick="sendKey(22, 0)">→</button>
                </div>
                <button class="key-btn" onclick="sendKey(20, 0)">↓</button>
                <div>
                    <button class="key-btn" onclick="sendKey(4, 0)">返回</button>
                    <button class="key-btn" onclick="sendKey(3, 0)">主页</button>
                    <button class="key-btn" onclick="sendKey(82, 0)">菜单</button>
                </div>
            </div>
            
            <!-- 触摸屏区域 -->
            <div class="touch-area">
                <h3>触摸屏</h3>
                <canvas id="touchCanvas" width="800" height="600"></canvas>
            </div>
        </div>
        
        <!-- REST API 测试 -->
        <div class="api-panel">
            <h2>REST API 测试</h2>
            <div class="api-buttons">
                <button onclick="testAPI('pre_open_browser')">预开浏览器</button>
                <button onclick="testAPI('delete_user_data')">删除用户数据</button>
                <button onclick="testAPI('load_extension')">加载扩展</button>
                <button onclick="testAPI('get_plugin_info')">获取插件信息</button>
            </div>
        </div>
        
        <!-- 日志输出 -->
        <div class="log-panel">
            <h2>日志</h2>
            <div id="logOutput" class="log-output"></div>
            <button onclick="clearLog()">清空日志</button>
        </div>
    </div>
    
    <script>
        let ws = null;
        let clientId = 'client_' + Date.now();
        let videoCanvas = null;
        let touchCanvas = null;
        
        // 初始化
        window.onload = function() {
            videoCanvas = document.getElementById('videoCanvas');
            touchCanvas = document.getElementById('touchCanvas');
            
            // 设置触摸事件
            setupTouchEvents();
            
            // 连接 WebSocket
            connectWebSocket();
        };
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${clientId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                addLog('WebSocket 连接已建立');
            };
            
            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
            
            ws.onerror = function(error) {
                addLog('WebSocket 错误: ' + error);
            };
            
            ws.onclose = function() {
                addLog('WebSocket 连接已关闭');
                setTimeout(connectWebSocket, 3000); // 3秒后重连
            };
        }
        
        function handleMessage(message) {
            switch(message.type) {
                case 'connection_status':
                    updateConnectionStatus(message.status, message.protocol, message.error);
                    if (message.status === 'failed') {
                        addLog(`连接失败: ${message.error || '未知错误'} (${message.protocol || ''})`);
                    } else {
                        addLog(`连接状态: ${message.status} (${message.protocol || ''})`);
                    }
                    break;
                case 'tcp_message':
                case 'websocket_message':
                    addLog(`收到消息: ${JSON.stringify(message)}`);
                    break;
                case 'media_frame':
                    addLog(`收到媒体帧: 类型=${message.frame_type}, 大小=${message.data_length}`);
                    break;
                case 'video_frame':
                    displayVideoFrame(message.frame_data, message.format);
                    break;
                case 'video_stream_status':
                    addLog(`视频流状态: ${message.status}`);
                    break;
                case 'rest_api_response':
                    addLog(`REST API 响应: ${JSON.stringify(message.result)}`);
                    break;
                case 'error':
                    addLog(`错误: ${message.message}`);
                    break;
            }
        }
        
        function connect() {
            const host = document.getElementById('serverHost').value;
            const protocolType = document.getElementById('protocolType').value;
            const imei = document.getElementById('imei').value;
            const imsi = document.getElementById('imsi').value;
            
            let message = {
                type: `connect_${protocolType}`,
                host: host,
                imei: imei,
                imsi: imsi
            };
            
            if (protocolType.includes('tcp')) {
                // 非 TLS 模式（不需要证书）
                const portMap = {
                    'tcp_control': 30001,  // 非 TLS 控制流端口
                    'tcp_media': 30011     // 非 TLS 媒体流端口
                };
                message.port = portMap[protocolType];
                message.use_tls = false;  // 使用非 TLS 模式
            } else if (protocolType.includes('websocket')) {
                const portMap = {
                    'websocket_control': 30005,
                    'websocket_media': 30002
                };
                message.port = portMap[protocolType];
            }
            
            ws.send(JSON.stringify(message));
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
        }
        
        function disconnect() {
            ws.send(JSON.stringify({type: 'disconnect'}));
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            updateConnectionStatus('disconnected');
        }
        
        function updateConnectionStatus(status, protocol, error) {
            const statusDiv = document.getElementById('connectionStatus');
            if (status === 'connected') {
                statusDiv.textContent = `已连接 (${protocol})`;
                statusDiv.className = 'status connected';
            } else if (status === 'failed') {
                statusDiv.textContent = `连接失败: ${error || '未知错误'}`;
                statusDiv.className = 'status failed';
            } else {
                statusDiv.textContent = '未连接';
                statusDiv.className = 'status disconnected';
            }
        }
        
        function sendKey(keyCode, action) {
            ws.send(JSON.stringify({
                type: 'key_event',
                key_code: keyCode,
                action: action
            }));
            addLog(`发送按键: ${keyCode}, 动作: ${action}`);
        }
        
        function setupTouchEvents() {
            let isDrawing = false;
            
            touchCanvas.addEventListener('mousedown', function(e) {
                isDrawing = true;
                const rect = touchCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) * (touchCanvas.width / rect.width));
                const y = Math.floor((e.clientY - rect.top) * (touchCanvas.height / rect.height));
                
                ws.send(JSON.stringify({
                    type: 'touch_event',
                    x: x,
                    y: y,
                    action: 0  // ACTION_DOWN
                }));
                addLog(`触摸按下: (${x}, ${y})`);
            });
            
            touchCanvas.addEventListener('mousemove', function(e) {
                if (isDrawing) {
                    const rect = touchCanvas.getBoundingClientRect();
                    const x = Math.floor((e.clientX - rect.left) * (touchCanvas.width / rect.width));
                    const y = Math.floor((e.clientY - rect.top) * (touchCanvas.height / rect.height));
                    
                    ws.send(JSON.stringify({
                        type: 'touch_event',
                        x: x,
                        y: y,
                        action: 2  // ACTION_MOVE
                    }));
                }
            });
            
            touchCanvas.addEventListener('mouseup', function(e) {
                if (isDrawing) {
                    isDrawing = false;
                    const rect = touchCanvas.getBoundingClientRect();
                    const x = Math.floor((e.clientX - rect.left) * (touchCanvas.width / rect.width));
                    const y = Math.floor((e.clientY - rect.top) * (touchCanvas.height / rect.height));
                    
                    ws.send(JSON.stringify({
                        type: 'touch_event',
                        x: x,
                        y: y,
                        action: 1  // ACTION_UP
                    }));
                    addLog(`触摸释放: (${x}, ${y})`);
                }
            });
        }
        
        function startVideoStream() {
            ws.send(JSON.stringify({
                type: 'start_video_stream',
                width: 1920,
                height: 1080,
                fps: 30,
                gop_size: 29
            }));
            addLog('开始视频流');
        }
        
        function stopVideoStream() {
            ws.send(JSON.stringify({
                type: 'stop_video_stream'
            }));
            addLog('停止视频流');
        }
        
        function testAPI(apiType) {
            const imei = document.getElementById('imei').value;
            const imsi = document.getElementById('imsi').value;
            
            let params = {};
            
            if (apiType === 'pre_open_browser') {
                params = {imei: imei, imsi: imsi};
            } else if (apiType === 'delete_user_data') {
                params = {imei: imei, imsi: imsi};
            } else if (apiType === 'load_extension') {
                // 加载扩展的默认测试参数
                params = {
                    name: "test-extension",
                    version: "1.0.0",
                    bucket_name: "test-bucket",
                    extension_file_path: "test-extension.jar",
                    type: "ChromeExtend"
                };
            }
            
            ws.send(JSON.stringify({
                type: 'rest_api',
                api_type: apiType,
                params: params
            }));
            addLog(`调用 REST API: ${apiType}`);
        }
        
        function addLog(message) {
            const logOutput = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            logOutput.innerHTML += `<div>[${time}] ${message}</div>`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('logOutput').innerHTML = '';
        }
        
        function displayVideoFrame(frameDataBase64, format) {
            if (!videoCanvas) {
                return;
            }
            
            try {
                // 创建 Image 对象
                const img = new Image();
                
                img.onload = function() {
                    // 绘制到 Canvas
                    const ctx = videoCanvas.getContext('2d');
                    ctx.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
                    ctx.drawImage(img, 0, 0, videoCanvas.width, videoCanvas.height);
                };
                
                img.onerror = function() {
                    console.error('加载视频帧失败');
                };
                
                // 设置图片源（base64 编码的 JPEG）
                img.src = 'data:image/jpeg;base64,' + frameDataBase64;
            } catch (e) {
                console.error('显示视频帧错误:', e);
            }
        }
    </script>
</body>
</html>
