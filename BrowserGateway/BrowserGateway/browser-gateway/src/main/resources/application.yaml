# 外网环境配置（使用自定义实现）

spring:
  main:
    allow-bean-definition-overriding: true
  
  custom:
    service-name: browser-gateway-external
    pod-name: browser-gateway-pod-1
    namespace: external
    certificate:
      ca-path: /etc/browsergw/ca.crt
      cert-path: /etc/browsergw/device.crt
      key-path: /etc/browsergw/device.key
    alarm:
      log-path: /var/log/browsergw/alarms.log
    service:
      mock-instances: true

# https 地址/内部地址
server:
  address: 127.0.0.1
  port: 8090

logging:
  file:
    name: /opt/logs/browsergw.log

browsergw:
  workspace: /opt/host
  chrome:
    headless: true
    record-mode: 1
    record-extension-id: majikpeglnhefidjkmpeipdbikkfbmho
    endpoint: http://127.0.0.1:8000
    executable-path: /usr/bin/chromium
    ttl: 360000000000 #ns 超过此时间无心跳的浏览器会被关闭
  # 上报到redis的信息，其中endpoint可能是外部地址
  report:
    cap: 300
    control-endpoint: ${edge_control_extend_endpoint:http://localhost:30001}
    media-endpoint: ${edge_media_extend_endpoint:http://localhost:30002}
    control-tls-endpoint: ${edge_control_tls_extend_endpoint:https://localhost:30003}
    media-tls-endpoint: ${edge_media_tls_extend_endpoint:https://localhost:30004}
    ttl: 120 # 过期时间
    chain-endpoints: ${chain_endpoints:}
    self-addr: ${browsergw_report_self_addr:localhost:8090}
  # socket信息
  websocket:
    media-port: 30002
    muen-port: 30005
    boss: 8
    worker: 64
    heartbeat-ttl: 300000 #ms 超过此时间无心跳的socket连接会被关闭
  # 定时任务周期
  scheduled:
    close-browser-period: 600000 #单位毫秒
    tcp-heartbeat-period: 600000 #单位毫秒
    check-browser-period: 600000 #单位毫秒
    report-period: 10000 #单位毫秒
    health-check-period: 60000
    session-report-period: 300000  #单位毫秒
    data-size-report-period: 300000  #单位毫秒
  # SNMP资源上报周期
  snmp:
    resource:
      report-period: 300000 #单位毫秒，5分钟上报一次CPU/内存负载
  # 本地tcp服务地址
  tcp:
    address: 127.0.0.1
    control-port: 30001  # 非 TLS 控制流端口（启用 enable-http 后可用）
    media-port: ${media_port:30011}  # 非 TLS 媒体流端口（启用 enable-http 后可用）
    control-tls-port: ${control_tls_port:30012}  # TLS 控制流端口（需要证书）
    media-tls-port: ${media_tls_port:30013}  # TLS 媒体流端口（需要证书）
    heartbeat-ttl: 360000000000 #ns 超过此时间无心跳的tcp连接会被关闭
    enable-http: true  # 启用非 TLS TCP 服务器（不需要证书）
  drop-frame-multi: 0.0
  context-limit: 20
  healthCheck:
    cpu-trigger-threshold: 90
    cpu-recover-threshold: 80
    memory-trigger-threshold: 90
    memory-recover-threshold: 80

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include:
            - ping
        readiness:
          include:
            - redis


snmp:
  server:
    ip: ${SNMP_SERVER_IP:192.168.16.4}
    port: ${SNMP_SERVER_PORT:162}
  timeout: 10000
  retry:
    times: 3
    interval: 5000

csp:
  adapter:
    environment: external